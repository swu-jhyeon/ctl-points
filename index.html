<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>교수법 프로그램 포인트 현황</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <h1>교수법 프로그램 포인트 현황</h1>
  <p class="sub">포인트 관리대장 엑셀을 올리면 현황이 바로 집계됩니다. 파일은 이 브라우저 안에서만 처리되며 어디에도 저장하거나 전송하지 않습니다.</p>

  <div class="card" id="drop">
    <div><b>엑셀 파일을 끌어다 놓거나 클릭해서 선택하세요</b></div>
    <div class="mute">교수법프로그램_포인트관리대장.xlsx (.xlsx)</div>
    <input type="file" id="f" accept=".xlsx,.xlsm" hidden>
    <div id="msg"></div>
  </div>

  <div id="app" hidden>
    <div class="tabs">
      <button id="t1" class="on">관리자 현황</button>
      <button id="t2">교수 조회</button>
    </div>

    <section id="v1">
      <div class="kpis" id="kpis"></div>

      <div class="card">
        <h2>프로그램별 현황</h2>
        <div class="scroll"><table><thead id="ph"></thead><tbody id="pb"></tbody></table></div>
      </div>

      <div class="card">
        <h2>교수별 순위 <span class="mute" id="rc"></span></h2>
        <div class="filters">
          <input id="q" placeholder="성명·교번·소속 검색">
          <select id="fg"><option value="">구분 전체</option></select>
          <select id="fd"><option value="">소속 전체</option></select>
        </div>
        <div class="scroll tall">
          <table>
            <thead><tr>
              <th class="c">순위</th><th>소속</th><th>구분</th><th>교번</th><th>성명</th>
              <th class="n">총 인정 포인트</th><th class="n">참여</th>
              <th>프로그램별 인정 포인트 (주황 = 상한 도달)</th>
            </tr></thead>
            <tbody id="rb"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section id="v2" hidden>
      <div class="card">
        <h2>내 포인트 조회 (업로드한 파일 기준)</h2>
        <div class="filters">
          <input id="lid" placeholder="교번을 입력하세요" inputmode="numeric">
          <button class="btn" id="lb">조회</button>
        </div>
        <div id="lo" class="mute">교번을 입력하면 총 인정 포인트와 프로그램별 적립 현황이 표시됩니다.</div>
      </div>
    </section>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
